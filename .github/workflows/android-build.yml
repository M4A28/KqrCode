name: Build APK

on:
  push:
    branches: [ '**' ]        # every push to any branch
    tags:     [ 'v*' ]        # also run when pushing release tags
  pull_request:
  workflow_dispatch:          # manual "Run workflow" button

# Cancel superseded builds on the same branch (saves CI minutes)
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Full history so git auto-versioning (commit count + tags) is correct.
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'   # must match JavaVersion.VERSION_17 in build.gradle.kts

      - name: Set up Gradle (with caching)
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      # Rename so artifacts are easy to tell apart between runs
      - name: Rename APK
        run: |
          mkdir -p output
          cp app/build/outputs/apk/debug/app-debug.apk \
             output/QRScanner-debug-${{ github.run_number }}.apk

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: QRScanner-debug-${{ github.run_number }}
          path: output/*.apk
          retention-days: 30
          if-no-files-found: error

  release:
    name: Build signed release APK
    needs: build
    # Only runs for tags like v1.0.0 — regular pushes skip this job entirely
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # Required: the default GITHUB_TOKEN is read-only, and creating a
    # GitHub Release (softprops/action-gh-release) needs contents: write.
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle (with caching)
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Decode keystore from secrets
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > release.keystore

      # AGP's "injected signing" properties sign the release build
      # without any changes to build.gradle.kts
      - name: Build signed release APK
        run: |
          ./gradlew assembleRelease --stacktrace \
            -Pandroid.injected.signing.store.file=$GITHUB_WORKSPACE/release.keystore \
            -Pandroid.injected.signing.store.password=${{ secrets.KEYSTORE_PASSWORD }} \
            -Pandroid.injected.signing.key.alias=${{ secrets.KEY_ALIAS }} \
            -Pandroid.injected.signing.key.password=${{ secrets.KEY_PASSWORD }}

      # Name the APK after the auto-computed version (source of truth),
      # e.g. QRScanner-v1.5.0.apk — falls back to the tag name.
      - name: Rename APK to match the computed version
        run: |
          VERSION=$(grep -o '"versionName": "[^"]*"' \
            app/build/outputs/apk/release/output-metadata.json | head -1 | cut -d '"' -f4)
          NAME="QRScanner-v${VERSION:-${GITHUB_REF_NAME#v}}.apk"
          echo "APK name: $NAME"
          mkdir -p output
          cp app/build/outputs/apk/release/app-release.apk "output/$NAME"
          echo "apk_name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: QRScanner-release-${{ github.ref_name }}
          path: output/*.apk
          if-no-files-found: error

      # Creates the GitHub Release for the pushed tag (if it doesn't exist yet)
      # and attaches the APK to it, with auto-generated release notes.
      - name: Attach APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: output/*.apk
          fail_on_unmatched_files: true
          generate_release_notes: true